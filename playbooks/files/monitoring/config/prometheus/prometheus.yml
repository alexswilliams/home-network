#          - telegraf:9273

#  - job_name: iot-metrics
#    scrape_interval: 10s
#    metrics_path: /metrics
#    static_configs:
#      - targets:
#          - iot-monitor:9981

  - job_name: govee-metrics
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.18.0.1:8080

storage:
  tsdb:
    out_of_order_time_window: "120s"

