global:
  scrape_interval: "10s"
  scrape_timeout: "5s"
  evaluation_interval: "30s"

scrape_configs:
  - job_name: prometheus-node-exporter
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - prom-node-exporter:9100

  - job_name: laptop-node-exporter
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - laptop-wired.main.local:9100
          - laptop-wifi.main.local:9100

  - job_name: desktop-node-exporter
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - desktop.main.local:9100

  - job_name: router-pi-node-exporter
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - router-pi.monitoring.local:9100

#  - job_name: router-telegraf
#    scrape_interval: 10s
#    metrics_path: /metrics
#    static_configs:
