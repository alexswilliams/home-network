[global_tags]

[agent]
interval = "10s"
round_interval = true

metric_batch_size = 1000
metric_buffer_limit = 10000

collection_jitter = "0s"
flush_interval = "10s"
flush_jitter = "0s"

precision = ""

debug = false
quiet = false

hostname = "monitoring-pi"
## If set to true, do no set the "host" tag in the telegraf agent.
omit_hostname = false

[[outputs.prometheus_client]]
listen = ":9273"
path = "/metrics"
expiration_interval = "60s"
collectors_exclude = ["gocollector", "process"]
export_timestamp = true
string_as_label = false

[[processors.regex]]
[[processors.regex.fields]]
key = "sysDescr"
pattern = "^.*CPU Usage: *(\\d+)%.*$"
replacement = "${1}"
result_key = "cpuUsage"

[[processors.regex.fields]]
key = "sysDescr"
pattern = "^.*Memory Usage: *(\\d+)%.*$"
replacement = "${1}"
result_key = "memoryUsage"

[[processors.converter]]
[processors.converter.fields]
float = ["memoryUsage", "cpuUsage"]

[[inputs.net_response]]
protocol = "tcp"
address = "192.168.1.1:80"
timeout = "1s"

[[inputs.net_response]]
protocol = "tcp"
address = "8.8.8.8:53"
timeout = "1s"

[[inputs.net_response]]
protocol = "tcp"
address = "1.1.1.1:53"
timeout = "1s"

[[inputs.net_response]]
protocol = "tcp"
address = "www.bbc.co.uk:80"
timeout = "1s"

[[inputs.net_response]]
protocol = "tcp"
address = "bbc.co.uk:80"
timeout = "1s"

[[inputs.net_response]]
protocol = "tcp"
address = "static.bbci.co.uk:80"
timeout = "1s"

[[inputs.net_response]]
protocol = "tcp"
address = "r.bbci.co.uk.edgekey.net:80"
timeout = "1s"
