- name: Install ansible
  ansible.builtin.package:
    state: present
    name: ansible

#- name: Install ansible
#  ansible.builtin.package:
#    state: present
#    name: "{{cron_pkg}}"

- name: Ansible project directory exists
  ansible.builtin.file:
    state: directory
    path: /opt/ansible
    recurse: false
    owner: root
    group: root
    mode: "0755"

- name: Ansible local task lists are present
  ansible.builtin.copy:
    dest: /opt/
    src: files/ansible
    group: root
    mode: "0644"

- name: Install Ansible Cron (LANG)
  ansible.builtin.cron:
    cron_file: /etc/cron.d/00_ansible
    user: alexw
    env: true
    name: LANG
    job: en_GB.UTF-8

- name: Install Ansible Cron (LC_CTYPE)
  ansible.builtin.cron:
    cron_file: /etc/cron.d/00_ansible
    user: alexw
    env: true
    name: LC_CTYPE
    job: en_GB.UTF-8
    insertafter: LANG

- name: Install Key Fetch Cron
  ansible.builtin.cron:
    cron_file: /etc/cron.d/00_ansible
    user: alexw
    name: fetch ssh pubkey file
    hour: "1,7,13,19"
    minute: "5"
    job: pushd /opt/ansible; ansible-playbook ./playbooks/cron-playbook.yaml
